name: Build ROUH Auto APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: car-launcher-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Import source ZIP once (if present)
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f car-launcher-modified.zip && ! -f settings.gradle.kts ]]; then
            echo "Inspecting ZIP contents..."
            unzip -Z -1 car-launcher-modified.zip | head -30 || true
            mkdir -p .import-src
            unzip -q car-launcher-modified.zip -d .import-src

            # Some GitHub source downloads wrap the actual Android ZIP.
            # Expand nested ZIPs (bounded to three levels), then locate Gradle.
            for depth in 1 2 3; do
              project_settings="$(find .import-src -type f -name settings.gradle.kts -print -quit)"
              if [[ -n "$project_settings" ]]; then break; fi
              nested_zip="$(find .import-src -type f -iname '*.zip' -print -quit)"
              if [[ -z "$nested_zip" ]]; then break; fi
              echo "Expanding nested archive (level $depth): $nested_zip"
              nested_dir=".import-src/nested-$depth"
              mkdir -p "$nested_dir"
              unzip -q "$nested_zip" -d "$nested_dir"
              rm -f "$nested_zip"
            done
            project_settings="$(find .import-src -type f -name settings.gradle.kts -print -quit)"
            if [[ -z "$project_settings" ]]; then
              echo "::error::No Android Gradle project found after expanding nested ZIPs."
              find .import-src -maxdepth 5 -type f | head -60 || true
              exit 1
            fi
            project_dir="$(dirname "$project_settings")"
            echo "Found Android project at: $project_dir"
            test -f "$project_dir/gradlew" || { echo "::error::Missing gradlew"; exit 1; }
            test -f "$project_dir/app/build.gradle.kts" || { echo "::error::Missing app/build.gradle.kts"; exit 1; }
            # Never overwrite the CI workflow with the one inside the legacy project.
            cp -a "$project_dir"/. ./
            git restore --source=HEAD -- .github/workflows/build.yml
            rm -rf .import-src
            rm car-launcher-modified.zip
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "chore: import launcher source as regular files"
              git push
            fi
          fi
          if [[ -f settings.gradle.kts && -f gradlew && -f app/build.gradle.kts ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Project source is not uploaded yet."
          fi

      - name: Set up Java 17
        if: steps.prepare.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        if: steps.prepare.outputs.ready == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        if: steps.prepare.outputs.ready == 'true'
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install private Thmanyah fonts for APK build
        if: steps.prepare.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/font
          # Private release assets are fetched with the repository's GitHub token.
          # Do not commit font files to source control.
          if gh release download font-assets --pattern 'Thmanyah-Font-Family.zip' --dir /tmp --clobber; then
            python3 - <<'PY'
          import zipfile, pathlib
          archive = zipfile.ZipFile('/tmp/Thmanyah-Font-Family.zip')
          out = pathlib.Path('app/src/main/res/font')
          for weight in ('Light', 'Regular', 'Medium', 'Bold', 'Black'):
              suffix = f'thmanyahsans-{weight}.otf'
              matches = [p for p in archive.namelist() if p.lower().endswith('/otf/' + suffix.lower()) and not p.startswith('__MACOSX/')]
              if len(matches) != 1:
                  raise SystemExit(f'Missing unique font file: {suffix}')
              (out / f'thmanyah_{weight.lower()}.otf').write_bytes(archive.read(matches[0]))
          print('Installed private Thmanyah Sans weights into APK resources.')
          PY
          else
            echo "::notice::Private font-assets release not found. Using CI system font fallback until uploaded."
            fallback="$(fc-match -f '%{file}' 'DejaVu Sans' | head -n 1)"
            test -s "$fallback"
            for weight in light regular medium bold black; do
              cp "$fallback" "app/src/main/res/font/thmanyah_${weight}.ttf"
            done
          fi

      - name: Assemble debug APK
        if: steps.prepare.outputs.ready == 'true'
        run: bash gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        if: steps.prepare.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rouh-auto-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct-download APK to rolling prerelease
        if: steps.prepare.outputs.ready == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          mkdir -p release-output
          cp "$apk" release-output/car-launcher-next-debug.apk

          # Reuse one stable download URL. This is a debug APK, not a production release.
          if ! gh release view latest-test >/dev/null 2>&1; then
            gh release create latest-test \
              --title "ROUH Auto - Latest Test APK" \
              --notes "Automatically built test APK from main. For emulator/head-unit testing only; not a signed production release." \
              --prerelease \
              --target "$GITHUB_SHA"
          fi
          gh release upload latest-test release-output/car-launcher-next-debug.apk --clobber
