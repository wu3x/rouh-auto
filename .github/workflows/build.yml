name: Build ROUH Auto APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rouh-auto-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install private Thmanyah fonts for APK build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/font
          # Private release assets are fetched with the repository's GitHub token.
          # Do not commit font files to source control.
          if gh release download font-assets --pattern 'Thmanyah-Font-Family.zip' --dir /tmp --clobber; then
            python3 - <<'PY'
          import zipfile, pathlib
          archive = zipfile.ZipFile('/tmp/Thmanyah-Font-Family.zip')
          out = pathlib.Path('app/src/main/res/font')
          for weight in ('Light', 'Regular', 'Medium', 'Bold', 'Black'):
              suffix = f'thmanyahsans-{weight}.otf'
              matches = [p for p in archive.namelist() if p.lower().endswith('/otf/' + suffix.lower()) and not p.startswith('__MACOSX/')]
              if len(matches) != 1:
                  raise SystemExit(f'Missing unique font file: {suffix}')
              (out / f'thmanyah_{weight.lower()}.otf').write_bytes(archive.read(matches[0]))
          print('Installed private Thmanyah Sans weights into APK resources.')
          PY
          else
            echo "::error::Required private Thmanyah font release is unavailable; refusing to publish an incorrectly branded APK."
            exit 1
          fi

      - name: Assemble debug APK
        env:
          ROUH_BUILD_NUMBER: ${{ github.run_number }}
        run: bash gradlew assembleDebug testDebugUnitTest --stacktrace --no-daemon

      - name: Verify APK identity
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          aapt="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt -type f | sort -V | tail -1)"
          test -x "$aapt"
          "$aapt" dump badging "$apk" | grep -E "^package: name='com\\.rouh\\.auto' "
          "$aapt" dump badging "$apk" | grep -F "application-label:'ROUH Auto'"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rouh-auto-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct-download APK to rolling prerelease
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          mkdir -p release-output
          cp "$apk" release-output/rouh-auto-debug.apk
          # Keep the former asset filename temporarily for existing download links.
          cp "$apk" release-output/car-launcher-next-debug.apk

          # Reuse one stable download URL. This is a debug APK, not a production release.
          if ! gh release view latest-test >/dev/null 2>&1; then
            gh release create latest-test \
              --title "ROUH Auto - Latest Test APK" \
              --notes "Automatically built test APK from main. For emulator/head-unit testing only; not a signed production release." \
              --prerelease \
              --target "$GITHUB_SHA"
          fi
          gh release upload latest-test release-output/rouh-auto-debug.apk release-output/car-launcher-next-debug.apk --clobber
