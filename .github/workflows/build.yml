name: Build ROUH Auto APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rouh-auto-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Assemble debug APK
        env:
          ROUH_BUILD_NUMBER: ${{ github.run_number }}
        run: bash gradlew assembleDebug testDebugUnitTest --stacktrace --no-daemon

      - name: Restore private release signing key
        shell: bash
        env:
          ROUH_KEYSTORE_BASE64: ${{ secrets.ROUH_KEYSTORE_BASE64 }}
          ROUH_KEYSTORE_PASSWORD: ${{ secrets.ROUH_KEYSTORE_PASSWORD }}
          ROUH_KEY_ALIAS: ${{ secrets.ROUH_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [[ -z "$ROUH_KEYSTORE_BASE64" || -z "$ROUH_KEYSTORE_PASSWORD" || -z "$ROUH_KEY_ALIAS" ]]; then
            echo "::error::Missing ROUH release signing secrets."
            exit 1
          fi
          umask 077
          printf '%s' "$ROUH_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rouh-auto-release.jks"
          test -s "$RUNNER_TEMP/rouh-auto-release.jks"
          echo "ROUH_KEYSTORE_PATH=$RUNNER_TEMP/rouh-auto-release.jks" >> "$GITHUB_ENV"

      - name: Assemble signed release APK
        env:
          ROUH_BUILD_NUMBER: ${{ github.run_number }}
          ROUH_KEYSTORE_PASSWORD: ${{ secrets.ROUH_KEYSTORE_PASSWORD }}
          ROUH_KEY_ALIAS: ${{ secrets.ROUH_KEY_ALIAS }}
        run: bash gradlew assembleRelease --stacktrace --no-daemon

      - name: Verify signed release APK
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -1)"
          test -f "$apksigner"
          "$apksigner" verify --verbose "$apk"
          aapt="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt -type f | sort -V | tail -1)"
          "$aapt" dump badging "$apk" | grep -E "^package: name='com\\.rouh\\.auto' "

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: rouh-auto-signed-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Verify APK identity
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          aapt="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt -type f | sort -V | tail -1)"
          test -x "$aapt"
          "$aapt" dump badging "$apk" | grep -E "^package: name='com\\.rouh\\.auto' "
          "$aapt" dump badging "$apk" | grep -F "application-label:'ROUH Auto'"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rouh-auto-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct-download APK to rolling prerelease
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          mkdir -p release-output
          cp "$apk" release-output/rouh-auto-debug.apk

          # Reuse one stable download URL. This is a debug APK, not a production release.
          if ! gh release view latest-test >/dev/null 2>&1; then
            gh release create latest-test \
              --title "ROUH Auto - Latest Test APK" \
              --notes "Automatically built test APK from main. For emulator/head-unit testing only; not a signed production release." \
              --prerelease \
              --target "$GITHUB_SHA"
          fi
          gh release upload latest-test release-output/rouh-auto-debug.apk --clobber

      - name: Publish signed APK for direct download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          mkdir -p release-output
          cp "$apk" release-output/rouh-auto-release.apk

          # Keep the signed build separate from debug test builds.
          if ! gh release view latest-signed >/dev/null 2>&1; then
            gh release create latest-signed \
              --title "ROUH Auto - Latest Signed APK" \
              --notes "Automatically built and verified release APK signed with the private ROUH Auto release key. The stable asset URL always points to the newest successful build." \
              --prerelease \
              --target "$GITHUB_SHA"
          fi
          gh release upload latest-signed release-output/rouh-auto-release.apk --clobber
